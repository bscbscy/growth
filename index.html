<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0d1117">
<title>知行合一</title>
<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --card2: #1c222b;
    --border: #30363d;
    --text: #e6edf3;
    --dim: #8b949e;
    --green: #3fb950;
    --red: #f85149;
    --gold: #ffd33d;
    --accent-body: #ff6b6b;
    --accent-know: #4dabf7;
    --accent-skill: #b197fc;
    --accent-charm: #f783ac;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    max-width: 860px;
    margin: 0 auto;
    padding: 20px 16px 60px;
    line-height: 1.5;
  }
  header {
    background: linear-gradient(135deg, #1a2029, #14181f);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 20px;
    margin-bottom: 18px;
    position: sticky;
    top: 8px;
    z-index: 10;
    box-shadow: 0 6px 24px rgba(0,0,0,.45);
  }
  .title-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  h1 { font-size: 20px; font-weight: 700; letter-spacing: 1px; }
  .date { color: var(--dim); font-size: 13px; }
  .status-row { display: flex; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .badge {
    color: #fff; font-weight: 700;
    padding: 4px 14px; border-radius: 999px;
    font-size: 14px; transition: .2s;
    cursor: pointer; white-space: nowrap;
  }
  .badge:hover { filter: brightness(1.15); }
  .badge-level { background: linear-gradient(135deg, #2ea043, #238636); box-shadow: 0 2px 10px rgba(46,160,67,.35); }
  .badge-streak { background: linear-gradient(135deg, #f0883e, #d9570c); box-shadow: 0 2px 10px rgba(240,136,62,.35); cursor: default; }
  .badge-exam { background: linear-gradient(135deg, #388bfd, #1f6feb); box-shadow: 0 2px 10px rgba(56,139,253,.35); }
  .badge-spirit { background: linear-gradient(135deg, #da77f2, #9775fa); box-shadow: 0 2px 10px rgba(218,119,242,.35); cursor: pointer; }
  .today-score { font-size: 14px; color: var(--dim); }
  .today-score b { color: var(--text); font-size: 18px; margin-left: 4px; }
  .level-rule { margin-top: 10px; font-size: 12px; color: var(--dim); border-top: 1px dashed var(--border); padding-top: 8px; }

  .attr-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 640px) { .attr-grid { grid-template-columns: 1fr; } }
  .attr-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-top: 3px solid var(--accent);
    border-radius: 12px;
    padding: 14px 16px 12px;
  }
  .card-head { margin-bottom: 10px; }
  .head-line { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .attr-name { font-size: 16px; font-weight: 700; }
  .attr-level { font-size: 12px; font-weight: 600; color: var(--accent); background: color-mix(in srgb, var(--accent) 15%, transparent); padding: 2px 8px; border-radius: 6px; }
  .progress { height: 8px; background: #21262d; border-radius: 99px; overflow: hidden; }
  .progress .bar { height: 100%; background: var(--accent); border-radius: 99px; transition: width .4s ease; }
  .points-row { display: flex; justify-content: space-between; margin-top: 6px; font-size: 12px; color: var(--dim); }
  .points-row b { color: var(--text); }

  .item { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid rgba(48,54,61,.5); }
  .item-name { flex: 1; font-size: 13.5px; }
  .item-name .tag { display: inline-block; font-size: 10px; color: var(--dim); border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; margin-left: 6px; vertical-align: 1px; }
  .item-score { font-size: 13px; font-weight: 600; min-width: 52px; text-align: right; font-variant-numeric: tabular-nums; }
  .pos { color: var(--green); }
  .neg { color: var(--red); }
  .zero { color: var(--dim); }
  .subline { display: flex; align-items: center; justify-content: flex-end; gap: 8px; border-top: none; padding-top: 0; padding-bottom: 6px; font-size: 11.5px; color: var(--dim); }
  .subline b { color: var(--accent-know); font-size: 13px; }

  .switch { position: relative; width: 40px; height: 22px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; cursor: pointer; background: #30363d; border-radius: 99px; transition: .25s; }
  .slider::before { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: #8b949e; border-radius: 50%; transition: .25s; }
  .switch input:checked + .slider { background: var(--gold); }
  .switch input:checked + .slider::before { transform: translateX(18px); background: #fff; }

  input[type="number"] {
    width: 74px; background: #21262d; border: 1px solid var(--border);
    color: var(--text); border-radius: 6px; padding: 4px 8px; font-size: 13px;
    text-align: right; font-variant-numeric: tabular-nums;
  }
  input[type="number"]:focus { outline: none; border-color: var(--accent); }

  .card-foot { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border); font-size: 12px; color: var(--dim); display: flex; justify-content: space-between; align-items: center; }
  .card-foot b { font-size: 15px; }

  footer { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
  .settle-btn {
    background: linear-gradient(135deg, #238636, #2ea043); color: #fff; border: none;
    padding: 13px; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; transition: .2s;
    box-shadow: 0 4px 14px rgba(46,160,67,.3);
  }
  .settle-btn:hover { filter: brightness(1.1); }
  .settle-btn.settled { background: linear-gradient(135deg, #1f6feb, #388bfd); }
  .row-btns { display: flex; gap: 10px; flex-wrap: wrap; }
  .ghost-btn {
    flex: 1; min-width: 100px; background: var(--card); border: 1px solid var(--border); color: var(--text);
    padding: 10px; border-radius: 8px; cursor: pointer; font-size: 13px; transition: .2s;
  }
  .ghost-btn:hover { border-color: var(--accent-know); }
  .danger-btn { color: var(--red); }
  .danger-btn:hover { border-color: var(--red); }

  .panel { margin-top: 16px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .panel h3 { font-size: 14px; margin-bottom: 10px; color: var(--dim); font-weight: 600; }

  .week-chart { display: flex; align-items: flex-end; gap: 8px; height: 130px; padding-top: 6px; }
  .week-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; min-width: 0; }
  .week-val { font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .week-bar-wrap { width: 100%; flex: 1; display: flex; align-items: flex-end; justify-content: center; }
  .week-bar { width: 55%; min-height: 3px; background: linear-gradient(180deg, var(--green), #2ea043); border-radius: 4px 4px 0 0; transition: height .4s ease; }
  .week-col.today .week-bar { background: linear-gradient(180deg, var(--gold), #ff9f43); }
  .week-col.empty .week-bar { background: #30363d; }
  .week-label { font-size: 11px; color: var(--dim); }
  .radar-title { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--border); font-size: 12.5px; color: var(--dim); text-align: center; }

  .ach-stats { font-size: 12.5px; color: var(--dim); margin-bottom: 10px; line-height: 1.8; }
  .ach-stats b { color: var(--gold); }
  .ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
  .ach-card { border: 1px solid var(--border); border-radius: 8px; padding: 10px; font-size: 12px; background: var(--card2); }
  .ach-card.unlocked { border-color: rgba(255,211,61,.5); box-shadow: 0 0 12px rgba(255,211,61,.08); }
  .ach-card.locked { opacity: .4; }
  .ach-icon { font-size: 20px; }
  .ach-name { font-weight: 700; margin: 4px 0 2px; }
  .ach-card.unlocked .ach-name { color: var(--gold); }
  .ach-desc { color: var(--dim); font-size: 11px; }

  .hist-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 4px; border-bottom: 1px solid rgba(48,54,61,.5); font-size: 13px; }
  .hist-row:last-child { border-bottom: none; }
  .hist-date { color: var(--dim); font-size: 12px; }
  .hist-scores { display: flex; gap: 10px; font-size: 12px; color: var(--dim); flex-wrap: wrap; }
  .hist-scores b { color: var(--text); }
  .hist-flag { font-size: 11px; padding: 1px 7px; border-radius: 5px; }
  .hist-flag.on { background: rgba(63,185,80,.15); color: var(--green); }
  .hist-flag.off { background: rgba(139,148,158,.12); color: var(--dim); }
  .hist-detail { padding: 6px 4px 10px; border-bottom: 1px dashed var(--border); display: flex; flex-wrap: wrap; gap: 6px; }
  .hist-tag { font-size: 11px; background: var(--card2); border: 1px solid var(--border); border-radius: 5px; padding: 2px 8px; color: var(--dim); }
  .hist-tag.done { color: var(--text); border-color: rgba(63,185,80,.4); }
  .hint { font-size: 11.5px; color: var(--dim); margin-top: 8px; }
  .flash { animation: flash .5s ease; }
  @keyframes flash { 0% { background: rgba(63,185,80,.25); } 100% { background: transparent; } }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(5,8,12,.78);
    display: flex; align-items: center; justify-content: center; z-index: 100;
    backdrop-filter: blur(6px);
    animation: fadeIn .25s ease;
  }
  .modal-overlay[hidden] { display: none; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: linear-gradient(165deg, #1d242f, #12161d);
    border: 1px solid rgba(255,211,61,.35);
    border-radius: 18px; padding: 32px 38px; text-align: center;
    max-width: 460px; width: 90%;
    box-shadow: 0 0 60px rgba(255,211,61,.15), 0 20px 60px rgba(0,0,0,.6);
    animation: pop .35s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .modal-glow { font-size: 13px; letter-spacing: 6px; color: var(--gold); font-weight: 800; margin-bottom: 6px; }
  .modal-title {
    font-size: 42px; font-weight: 900; margin: 8px 0 2px;
    background: linear-gradient(90deg, #ffd33d, #ff9f43, #ff6b6b);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .modal-rank { font-size: 19px; font-weight: 800; color: var(--gold); margin: 6px 0 12px; }
  .modal-desc { font-size: 14px; color: var(--dim); line-height: 1.8; margin-bottom: 22px; white-space: pre-line; }
  .modal button {
    background: linear-gradient(135deg, #238636, #2ea043); color: #fff; border: none;
    padding: 11px 34px; border-radius: 999px; font-size: 14px; font-weight: 700; cursor: pointer; transition: .2s;
  }
  .modal button:hover { filter: brightness(1.15); }
</style>
</head>
<body>

<header>
  <div class="title-row">
    <h1>🌱 知行合一</h1>
    <span class="date" id="dateLabel"></span>
  </div>
  <div class="status-row">
    <div class="badge badge-level" id="charBadge" onclick="showRank()" title="点击查看当前境界">凡人</div>
    <div class="badge badge-streak" id="streakBadge" title="连续打卡天数（断签归零）">🔥 连续 0 天</div>
    <div class="badge badge-spirit" id="spiritBadge" onclick="setSpiritStones()" title="点击修改灵石总量">💎 110,000（×1.0）</div>
    <div class="badge badge-exam" id="examBadge" onclick="setExamDate()" title="点击设置/修改上岸目标日期">🎯 设个上岸目标</div>
    <div class="today-score">今日得分 <b id="todayTotal">0</b></div>
  </div>
  <div class="level-rule">修炼规则：四属性各满 30 点升 1 层（每10层突破大境界）。完整境界：凡人→炼气→筑基→金丹→元婴→化神→炼虚→合体→大乘→渡劫→飞升</div>
</header>

<main class="attr-grid" id="attrGrid"><!-- cards injected --></main>

<footer>
  <button class="settle-btn" id="settleBtn" onclick="settle()">✅ 结算今日得分</button>
  <div class="row-btns">
    <button class="ghost-btn" id="weekBtn" onclick="toggleWeek()">📊 统计雷达</button>
    <button class="ghost-btn" id="achBtn" onclick="toggleAchievements()">🏆 成就</button>
    <button class="ghost-btn" onclick="showRandomQuote()">🎲 语录</button>
    <button class="ghost-btn" id="histBtn" onclick="toggleHistory()">📅 历史</button>
    <button class="ghost-btn" id="makeupBtn" onclick="enterMakeupMode()">⏪ 补签</button>
  </div>
  <div class="row-btns">
    <button class="ghost-btn" onclick="exportData()">💾 导出备份</button>
    <button class="ghost-btn" onclick="importData()">📂 导入备份</button>
    <button class="ghost-btn danger-btn" onclick="resetAll()">🗑 清空</button>
  </div>
</footer>

<section class="panel" id="weekPanel" hidden></section>
<section class="panel" id="achPanel" hidden></section>
<section class="panel" id="historyPanel" hidden></section>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<div class="modal-overlay" id="levelModal" hidden>
  <div class="modal">
    <div class="modal-glow" id="mGlow">✨ 境界突破 ✨</div>
    <div class="modal-title" id="mTitle">炼气1层</div>
    <div class="modal-rank" id="mRank">境界</div>
    <div class="modal-desc" id="mDesc">评价</div>
    <button onclick="closeModal()" id="mBtn">继续修炼 💪</button>
  </div>
</div>

<script>
/* ================= 配置 ================= */
const CONFIG = {
  appName: "知行合一",
  character: { name: "杨裕珏" },
  attributes: {
    body: {
      label: "体魄", accent: "var(--accent-body)",
      items: [
        { id: "body_gym",   name: "健身/力量训练30分钟起", points: 1.0, type: "boolean" },
        { id: "body_eyes",   name: "护眼（远眺+眨眼操）",    points: 0.2, type: "boolean" },
        { id: "body_sleep", name: "12点前睡",              points: 0.3, type: "boolean" },
        { id: "body_nosnack", name: "不吃零食/不喝甜饮",    points: 0.2, type: "boolean" },
        { id: "body_wall",  name: "靠墙站10分钟",          points: 0.1, type: "boolean" },
        { id: "body_shower",name: "洗浴",                    points: 0.15, type: "boolean" },
        { id: "body_water", name: "喝水（建议1500-2000ml）", type: "progress", unit: "ml",
          dailyRequirement: 2000, points: 0.15,
          rule: "按比例计分：喝满2000ml得+0.15，多喝不额外加分" }
      ]
    },
    knowledge: {
      label: "学识", accent: "var(--accent-know)",
      items: [
        { id: "know_study", name: "考公学习（刷题+看视频）", type: "study", unit: "小时",
          pointsPerHour: 0.5,
          rule: "每学满1小时打卡1次 +0.5；多学多加分，上不封顶（学2h=2次卡+1.0）" },
        { id: "know_english",  name: "学习英语",           points: 0.25, type: "boolean" },
        { id: "know_read",     name: "阅读30分钟（可选）",    points: 0.25, type: "boolean" }
      ]
    },
    skill: {
      label: "技能", accent: "var(--accent-skill)",
      items: [
        {
          id: "skill_writing", name: "写作", type: "progress", unit: "字",
          stepSize: 2000, pointsPerStep: 0.15,
          maxPoints: null,
          formula: "每写2000字+0.15，上不封顶，不扣分"
        },
        { id: "skill_post", name: "支付宝帖子2篇（硬性）", type: "progress", unit: "篇",
          dailyRequirement: 2, points: 0.3,
          rule: "不足2篇该项记0，不给部分分" },
        { id: "skill_review",  name: "每日复盘+明日计划", points: 0.25, type: "boolean" },
        { id: "skill_practice",name: "刻意练习（可选）",    points: 0.5, type: "boolean" }
      ]
    },
    charm: {
      label: "魅力", accent: "var(--accent-charm)",
      items: [
        { id: "charm_wakeup",    name: "准时起（固定时间）", points: 0.1, type: "boolean" },
        { id: "charm_posture",   name: "挺胸抬头",          points: 0.5, type: "boolean" },
        { id: "charm_skincare",  name: "护肤（早晚各一次）", type: "skincare",
          morningPoints: 0.05, nightPoints: 0.05,
          rule: "早晚都做+0.1；只做一次+0.05；都不做0" },
        { id: "charm_meditation",name: "静默/冥想10分钟",    points: 0.2, type: "boolean" },
        { id: "charm_speech",    name: "克制性发言（想插嘴/抱怨/炫耀时闭嘴）", points: 0.5, type: "boolean" },
        { id: "charm_praise",    name: "赞美别人一次",       points: 0.3, type: "boolean" },
        { id: "charm_dress",     name: "穿搭得体",           points: 0.3, type: "boolean" },
        { id: "charm_selfctrl",  name: "克己（遵守给自己的约定，如游戏不超时）", type: "discipline", passPoints: 0.3, failPenalty: 0.2 },
        { id: "charm_anger",     name: "制怒（控制脾气不发火）",       type: "discipline", passPoints: 0.3, failPenalty: 0.2 }
      ]
    }
  },
  maxPerLevel: 30
};

/* ================= 修仙境界 ================= */
function realmLabel(level) {
  if (level <= 0) return "凡人";
  const realms = ["炼气", "筑基", "金丹", "元婴", "化神", "炼虚", "合体", "大乘", "渡劫", "飞升"];
  const idx = Math.floor((level - 1) / 10);
  const layer = ((level - 1) % 10) + 1;
  if (idx >= realms.length) return `飞升${layer}层`;
  return `${realms[idx]}${layer}层`;
}

function rankFor(level) {
  if (level <= 0) return { title: "凡人", desc: "连灵气都感应不到的普通人。系统建议：先从每天修炼30分钟开始。" };
  const realms = ["炼气", "筑基", "金丹", "元婴", "化神", "炼虚", "合体", "大乘", "渡劫", "飞升"];
  const idx = Math.floor((level - 1) / 10);
  const layer = ((level - 1) % 10) + 1;
  if (idx >= realms.length) {
    return { title: `飞升${layer}层`, desc: `等级 ${level}。已飞升上界，超脱凡尘。系统已无法评估你的上限，你本身就是规则。` };
  }
  const realm = realms[idx];
  const title = `${realm}${layer}层`;
  const descs = [
    `刚刚踏入修仙门槛，气感初成。体内真气如游丝，但好歹算入门了。炼气${layer}层，继续努力。`,
    `丹田已固，根基初成。在宗门里能当个外门弟子了。筑基${layer}层，稳住发育别浪。`,
    `金丹已成，寿命大增。可以横着走了——但别遇到元婴老怪。金丹${layer}层。`,
    `元婴出窍，神识万里。可以开宗立派了。元婴${layer}层，离化神一步之遥。`,
    `化神归真，超凡入圣。连系统都想给你鼓掌。化神${layer}层。`,
    `炼虚合道，与天地共鸣。炼虚${layer}层，你本身就是一部功法。`,
    `天人合一，万法归宗。合体${layer}层，系统已经算不清你的上限了。`,
    `大乘圆满，只差一步渡劫。大乘${layer}层——记住渡劫时别穿白衣服，血溅上去不好洗。`,
    `天劫在头顶，雷电在咆哮。渡劫${layer}层，扛过去就是飞升！`,
  ];
  return { title, desc: descs[idx] || `等级 ${level}，系统已无法评估。` };
}

/* ================= 灵石修炼速率 ================= */
function spiritMultiplier(stones) {
  const step = Math.floor(stones / 50000);
  return Math.min(1.0 + step * 0.2, 5.0);
}

/* ================= 数据层 ================= */
const KEY = "yyj_growth_system_v1";
const DATA_VERSION = 2;
let state = load();

function load() {
  try {
    const raw = JSON.parse(localStorage.getItem(KEY));
    if (raw) {
      if (raw.spiritStones === undefined) raw.spiritStones = 110000;
      if (!raw.streakRewards) raw.streakRewards = [];
      if (!raw.bonusPoints) raw.bonusPoints = { body: 0, knowledge: 0, skill: 0, charm: 0 };
      if (raw.dataVersion === DATA_VERSION) return raw;
      if (Object.keys(raw.history || {}).length > 0) {
        if (confirm("检测到旧版本数据。建议清空历史数据从今天重新开始。\n\n选「确定」→ 清空数据\n选「取消」→ 保留旧数据")) {
          localStorage.removeItem(KEY);
          return { history: {}, dataVersion: DATA_VERSION, spiritStones: 110000, streakRewards: [], bonusPoints: { body: 0, knowledge: 0, skill: 0, charm: 0 } };
        }
      }
      return { ...raw, history: raw?.history || {}, dataVersion: DATA_VERSION, spiritStones: raw.spiritStones || 110000, streakRewards: raw.streakRewards || [], bonusPoints: raw.bonusPoints || { body: 0, knowledge: 0, skill: 0, charm: 0 } };
    }
    return { history: {}, dataVersion: DATA_VERSION, spiritStones: 110000, streakRewards: [], bonusPoints: { body: 0, knowledge: 0, skill: 0, charm: 0 } };
  } catch { return { history: {}, dataVersion: DATA_VERSION, spiritStones: 110000, streakRewards: [], bonusPoints: { body: 0, knowledge: 0, skill: 0, charm: 0 } }; }
}
function save() { localStorage.setItem(KEY, JSON.stringify(state)); }

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function weekday(dateStr) {
  const d = dateStr ? new Date(dateStr + "T00:00:00") : new Date();
  return ["日","一","二","三","四","五","六"][d.getDay()];
}
const TODAY = todayStr();

let _makeupDate = null; // 补签模式：设为昨天日期字符串则查看/结算昨天

function activeDate() {
  return _makeupDate || todayStr();
}

function todayEntry() {
  const target = activeDate();
  if (!state.history[target]) state.history[target] = { items: {}, scores: null, settled: false };
  return state.history[target];
}

/* ================= 计分核心 ================= */
function calcItemScore(item, value) {
  if (item.type === "boolean") return value ? item.points : 0;
  if (item.type === "discipline") return value ? item.passPoints : -item.failPenalty;
  if (item.type === "skincare") {
    if (!value) return 0;
    return (value.m ? item.morningPoints : 0) + (value.n ? item.nightPoints : 0);
  }
  if (item.type === "study") {
    const hours = Number(value) || 0;
    return hours * item.pointsPerHour;
  }
  if (item.type === "progress") {
    if (item.id === "skill_writing") {
      const words = Number(value) || 0;
      const steps = Math.floor(words / 2000);
      return item.pointsPerStep * steps;
    }
    if (item.id === "skill_post") {
      const n = Number(value) || 0;
      return n >= item.dailyRequirement ? item.points : 0;
    }
    if (item.id === "body_water") {
      const v = Number(value) || 0;
      return Math.min(item.points, (v / item.dailyRequirement) * item.points);
    }
  }
  return 0;
}

function computeScores(items) {
  const out = {};
  for (const [key, attr] of Object.entries(CONFIG.attributes)) {
    let sum = 0;
    for (const it of attr.items) sum += calcItemScore(it, items[it.id]);
    out[key] = Math.round(sum * 1000) / 1000;
  }
  return out;
}

function totals() {
  const t = { body: 0, knowledge: 0, skill: 0, charm: 0 };
  for (const entry of Object.values(state.history)) {
    if (entry.settled && entry.scores) {
      for (const k in t) t[k] += entry.scores[k] || 0;
    }
  }
  const bp = state.bonusPoints || {};
  for (const k in t) t[k] += bp[k] || 0;
  return t;
}

function levelsOf(tot) {
  const out = {};
  for (const k in tot) {
    let total = tot[k];
    let level = 0;
    if (total >= CONFIG.maxPerLevel) level = Math.floor(total / CONFIG.maxPerLevel);
    out[k] = { level, current: Math.round((total - level * CONFIG.maxPerLevel) * 1000) / 1000, total: Math.round(total * 1000) / 1000 };
  }
  out.characterLevel = Math.min(...Object.values(out).map(o => o.level));
  return out;
}

function dayTotal(entry) {
  if (!entry || !entry.settled || !entry.scores) return null;
  return Math.round((entry.scores.body + entry.scores.knowledge + entry.scores.skill + entry.scores.charm) * 1000) / 1000;
}

/* ================= 渲染 ================= */
function buildCard(key, attr, info) {
  const el = document.createElement("div");
  el.className = "attr-card";
  el.style.setProperty("--accent", attr.accent);
  let itemsHtml = "";
  for (const it of attr.items) itemsHtml += buildItem(key, it);
  el.innerHTML = `
    <div class="card-head">
      <div class="head-line">
        <span class="attr-name">${attr.label}</span>
        <span class="attr-level" id="lvl_${key}">${realmLabel(info.level)}</span>
      </div>
      <div class="progress"><div class="bar" id="bar_${key}" style="width:${pct(info.current)}%"></div></div>
      <div class="points-row"><span>本级进度</span><span id="pts_${key}"><b>${fmt(info.current)}</b> / ${CONFIG.maxPerLevel}</span></div>
    </div>
    ${itemsHtml}
    <div class="card-foot">
      <span>今日「${attr.label}」得分</span>
      <b id="cardScore_${key}">+0</b>
    </div>`;
  return el;
}

function pct(cur) { return Math.min(100, Math.max(0, (cur / CONFIG.maxPerLevel) * 100)); }
function fmt(n) { return (Math.round(n * 1000) / 1000).toString(); }
function scoreClass(n) { return n > 0 ? "pos" : n < 0 ? "neg" : "zero"; }
function scoreText(n) { return (n > 0 ? "+" : "") + fmt(n); }

function buildItem(attrKey, item) {
  if (item.type === "boolean" || item.type === "discipline") {
    const tag = item.type === "discipline"
      ? `做到+${item.passPoints}/破戒-${item.failPenalty}`
      : `+${item.points}`;
    return `
      <div class="item">
        <span class="item-name">${item.name}<span class="tag">${tag}</span></span>
        <span class="item-score" id="sc_${item.id}">0</span>
        <label class="switch">
          <input type="checkbox" data-item="${item.id}" onchange="onChange('${item.id}')">
          <span class="slider"></span>
        </label>
      </div>`;
  }
  if (item.type === "skincare") {
    return `
      <div class="item">
        <span class="item-name">${item.name}<span class="tag">早晚各+0.05</span></span>
        <span class="item-score" id="sc_${item.id}">0</span>
        <label class="switch"><input type="checkbox" data-item="${item.id}" data-slot="m" onchange="onChange('${item.id}')"><span class="slider"></span></label>
        <label class="switch"><input type="checkbox" data-item="${item.id}" data-slot="n" onchange="onChange('${item.id}')"><span class="slider"></span></label>
      </div>`;
  }
  if (item.type === "study") {
    return `
      <div class="item">
        <span class="item-name">${item.name}<span class="tag">每小时+0.5</span></span>
        <span class="item-score" id="sc_${item.id}">0</span>
        <input type="number" min="0" step="0.5" placeholder="小时" data-item="${item.id}" oninput="onInput('${item.id}')">
      </div>
      <div class="item subline">
        <span>打卡：<b id="ck_${item.id}">0</b> 次</span>
        <span style="color:var(--dim)">每满1小时=1次卡，多学多加分</span>
      </div>`;
  }
  if (item.type === "progress") {
    const hint = item.id === "skill_writing"
      ? `每写2000字+0.15，上不封顶，不扣分`
      : item.id === "body_water"
        ? `按比例计分：喝满 ${item.dailyRequirement}ml 得 +${item.points}，多喝不加分（建议每天 1500-2000ml）`
        : `≥${item.dailyRequirement}${item.unit} +${item.points}，不足整项记0`;
    return `
      <div class="item">
        <span class="item-name">${item.name}<span class="tag">${item.id==="skill_writing"?"每2000字+0.15":"进度"}</span></span>
        <span class="item-score" id="sc_${item.id}">0</span>
        <input type="number" min="0" placeholder="${item.unit}" data-item="${item.id}" oninput="onInput('${item.id}')">
      </div>
      <div class="item subline">${hint}</div>`;
  }
  return "";
}

function render() {
  const entry = todayEntry();
  const items = entry.items || {};
  const grid = document.getElementById("attrGrid");
  grid.innerHTML = "";
  const tot = totals();
  const info = levelsOf(tot);

  for (const [key, attr] of Object.entries(CONFIG.attributes)) {
    const card = buildCard(key, attr, info[key]);
    grid.appendChild(card);
    for (const it of attr.items) {
      const val = items[it.id];
      const inputs = card.querySelectorAll(`input[data-item="${it.id}"]`);
      inputs.forEach(inp => {
        if (it.type === "skincare") {
          if (inp.dataset.slot === "m") inp.checked = !!(val && val.m);
          if (inp.dataset.slot === "n") inp.checked = !!(val && val.n);
        } else if (it.type === "boolean" || it.type === "discipline") {
          inp.checked = !!val;
        } else {
          inp.value = (val === null || val === undefined) ? "" : val;
        }
      });
    }
  }

  const ad = activeDate();
  const isMakeup = !!_makeupDate;
  document.getElementById("charBadge").textContent = realmLabel(info.characterLevel);
  document.getElementById("streakBadge").textContent = `🔥 连续 ${computeStreak()} 天`;
  document.getElementById("dateLabel").textContent = `${ad} 周${weekday(ad)}${isMakeup ? ' ⏪ 补签模式' : ''}`;

  const stones = state.spiritStones || 0;
  const mult = spiritMultiplier(stones);
  document.getElementById("spiritBadge").textContent = `💎 ${stones.toLocaleString()}（×${mult}）`;

  const ed = examDays();
  const eb = document.getElementById("examBadge");
  if (ed === null) eb.textContent = "🎯 设个上岸目标";
  else if (ed > 0) eb.textContent = `🎯 距上岸 ${ed} 天`;
  else if (ed === 0) eb.textContent = "🎯 就是今天！";
  else eb.textContent = "🎯 目标日已过";

  const btn = document.getElementById("settleBtn");
  if (entry.settled) {
    btn.textContent = isMakeup ? "✅ 昨日已补签" : "✅ 今日已结算（修改后点此更新）";
    btn.classList.add("settled");
  } else {
    btn.textContent = isMakeup ? "📝 补签昨日打卡" : "✅ 结算今日得分";
    btn.classList.remove("settled");
  }

  updateScores();
}

function updateScores() {
  const entry = todayEntry();
  const items = entry.items || {};
  const scores = computeScores(items);
  let total = 0;
  for (const [key, attr] of Object.entries(CONFIG.attributes)) {
    const s = scores[key];
    total += s;
    const scEl = document.getElementById(`cardScore_${key}`);
    if (scEl) { scEl.textContent = scoreText(s); scEl.className = scoreClass(s); }
    for (const it of attr.items) {
      const el = document.getElementById(`sc_${it.id}`);
      if (el) {
        const v = calcItemScore(it, items[it.id]);
        el.textContent = scoreText(v);
        el.className = "item-score " + scoreClass(v);
      }
      if (it.type === "study") {
        const ck = document.getElementById(`ck_${it.id}`);
        if (ck) ck.textContent = Math.floor(Number(items[it.id]) || 0);
      }
    }
  }
  const tEl = document.getElementById("todayTotal");
  tEl.textContent = scoreText(Math.round(total * 1000) / 1000);
  tEl.className = scoreClass(total);
}

/* ================= 交互 ================= */
function collectItems() {
  const items = {};
  for (const [key, attr] of Object.entries(CONFIG.attributes)) {
    for (const it of attr.items) {
      const inputs = document.querySelectorAll(`input[data-item="${it.id}"]`);
      if (it.type === "boolean" || it.type === "discipline") {
        inputs.forEach(inp => { if (inp.type === "checkbox") items[it.id] = inp.checked; });
      } else if (it.type === "skincare") {
        const m = document.querySelector(`input[data-item="${it.id}"][data-slot="m"]`);
        const n = document.querySelector(`input[data-item="${it.id}"][data-slot="n"]`);
        items[it.id] = { m: m && m.checked, n: n && n.checked };
      } else {
        inputs.forEach(inp => {
          if (inp.type === "number") items[it.id] = inp.value === "" ? null : Number(inp.value);
        });
      }
    }
  }
  return items;
}

function onChange(id) { const items = collectItems(); todayEntry().items = items; save(); updateScores(); }
function onInput(id) { const items = collectItems(); todayEntry().items = items; save(); updateScores(); }

/* ================= 连续打卡神秘奖励 ================= */
const STREAK_BONUSES = [
  { days: 7, points: { body: 0.3, knowledge: 0.3, skill: 0.3, charm: 0.3 }, name: "七日筑基" },
  { days: 30, points: { body: 1.0, knowledge: 1.0, skill: 1.0, charm: 1.0 }, name: "一月入道" },
  { days: 100, points: { body: 3.0, knowledge: 3.0, skill: 3.0, charm: 3.0 }, name: "百日筑基" },
  { days: 365, points: { body: 10.0, knowledge: 10.0, skill: 10.0, charm: 10.0 }, name: "一年飞升" }
];

function checkStreakBonus() {
  const streak = computeStreak();
  const claimed = state.streakRewards || [];
  for (const b of STREAK_BONUSES) {
    if (streak >= b.days && !claimed.includes(b.days)) {
      state.streakRewards = [...claimed, b.days];
      if (!state.bonusPoints) state.bonusPoints = { body: 0, knowledge: 0, skill: 0, charm: 0 };
      for (const k in b.points) state.bonusPoints[k] = (state.bonusPoints[k] || 0) + b.points[k];
      save();
      const pointStr = Object.entries(b.points).map(([k, v]) => {
        const labels = { body: "体魄", knowledge: "学识", skill: "技能", charm: "魅力" };
        return `${labels[k]}+${v}`;
      }).join("，");
      showModal("🎁 神秘宝箱", `连续打卡 ${b.days} 天`, `✨「${b.name}」成就达成`, `恭喜连续打卡 ${b.days} 天！获得修为奖励：\n${pointStr}\n\n继续坚持，下一个里程碑在等你！`, "收下奖励 🎉");
      return true;
    }
  }
  return false;
}

function settle() {
  const entry = todayEntry();
  const items = collectItems();
  entry.items = items;

  const baseScores = computeScores(items);
  const mult = spiritMultiplier(state.spiritStones || 0);
  entry.scores = {};
  for (const k in baseScores) {
    entry.scores[k] = Math.round(baseScores[k] * mult * 1000) / 1000;
  }
  entry.settled = true;
  save();

  const review = dailyReview(baseScores, items);
  entry.review = review;
  save();

  const gotBonus = checkStreakBonus();

  const info = levelsOf(totals());
  const prev = (state.lastCharLevel === undefined) ? info.characterLevel : state.lastCharLevel;
  state.lastCharLevel = info.characterLevel;
  save();

  // 补签模式结算后自动退出
  if (_makeupDate) {
    _makeupDate = null;
  }

  render();
  document.getElementById("settleBtn").classList.add("flash");

  if (gotBonus) {
    pendingAfterClose = review;
  } else if (info.characterLevel > prev) {
    pendingAfterClose = review;
    showLevelUp(info.characterLevel);
  } else {
    showModal(review.glow, review.title, review.rank, review.desc, review.btn);
  }
}

/* ================= 灵石设置 ================= */
function setSpiritStones() {

/* ================= 连续打卡 & 考公倒计时 ================= */
function computeStreak() {
  const settled = new Set();
  for (const [d, e] of Object.entries(state.history)) if (e.settled) settled.add(d);
  const now = new Date();
  let d = new Date(now);
  if (!settled.has(todayStr())) d = new Date(now.getTime() - 86400000);
  let streak = 0;
  while (true) {
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    if (settled.has(key)) { streak++; d = new Date(d.getTime() - 86400000); }
    else break;
  }
  return streak;
}

function examDays() {
  if (!state.examDate) return null;
  const e = new Date(state.examDate + "T00:00:00");
  const t = new Date(todayStr() + "T00:00:00");
  return Math.round((e - t) / 86400000);
}
function setExamDate() {
  const v = prompt("输入上岸目标日期（格式 YYYY-MM-DD，例如 2026-12-01）：", state.examDate || "");
  if (v === null) return;
  const vv = v.trim();
  if (!vv) { state.examDate = null; save(); render(); return; }
  const d = new Date(vv + "T00:00:00");
  if (isNaN(d.getTime())) { alert("日期格式不对，请用 YYYY-MM-DD，例如 2026-12-01"); return; }
  state.examDate = vv;
  save();
  render();
}

/* ================= 本周统计 & 雷达图 ================= */
function weekStats() {
  const now = new Date();
  const dow = now.getDay() === 0 ? 7 : now.getDay();
  const monday = new Date(now);
  monday.setDate(now.getDate() - (dow - 1));
  const labels = ["一", "二", "三", "四", "五", "六", "日"];
  const out = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    out.push({ label: labels[i], key, total: dayTotal(state.history[key]), isToday: key === todayStr() });
  }
  return out;
}

function toggleWeek() {
  const panel = document.getElementById("weekPanel");
  const btn = document.getElementById("weekBtn");
  if (panel.hidden) { renderWeek(); panel.hidden = false; btn.textContent = "📊 收起统计"; }
  else { panel.hidden = true; btn.textContent = "📊 统计雷达"; }
}

function renderWeek() {
  const stats = weekStats();
  const max = Math.max(3, ...stats.map(s => s.total || 0));
  let html = `<h3>📊 本周概览（周一到周日）· 连续打卡 <b style="color:var(--gold)">${computeStreak()}</b> 天</h3><div class="week-chart">`;
  for (const s of stats) {
    const h = s.total === null ? 0 : Math.max(4, Math.round((s.total / max) * 100));
    html += `<div class="week-col ${s.isToday ? "today" : ""} ${s.total === null ? "empty" : ""}">
      <div class="week-val">${s.total === null ? "—" : fmt(s.total)}</div>
      <div class="week-bar-wrap"><div class="week-bar" style="height:${h}%"></div></div>
      <div class="week-label">${s.isToday ? "今" : s.label}</div>
    </div>`;
  }
  html += `</div>`;
  html += `<div class="radar-title">— 四维修炼雷达（累计属性）—</div>${radarSvg()}`;
  html += `<div class="hint">柱子越高得分越多；金色为今天。连续打卡按「已结算」天数计算，断一天即归零。</div>`;
  document.getElementById("weekPanel").innerHTML = html;
}

function radarSvg() {
  const tot = totals();
  const vals = [tot.body, tot.knowledge, tot.skill, tot.charm];
  const maxV = Math.max(30, ...vals);
  const cx = 110, cy = 110, r = 82;
  const angles = [-90, 0, 90, 180].map(a => a * Math.PI / 180);
  const labels = ["体魄", "学识", "技能", "魅力"];
  const colors = ["#ff6b6b", "#4dabf7", "#b197fc", "#f783ac"];
  let rings = "";
  for (let ring = 1; ring <= 3; ring++) {
    const pts = angles.map(a => `${(cx + r * ring/3 * Math.cos(a)).toFixed(1)},${(cy + r * ring/3 * Math.sin(a)).toFixed(1)}`).join(" ");
    rings += `<polygon points="${pts}" fill="none" stroke="#30363d" stroke-width="1"/>`;
  }
  let axes = "";
  angles.forEach(a => { axes += `<line x1="${cx}" y1="${cy}" x2="${(cx + r * Math.cos(a)).toFixed(1)}" y2="${(cy + r * Math.sin(a)).toFixed(1)}" stroke="#30363d" stroke-width="1"/>`; });
  const dataPts = vals.map((v, i) => `${(cx + r * Math.max(0.03, v / maxV) * Math.cos(angles[i])).toFixed(1)},${(cy + r * Math.max(0.03, v / maxV) * Math.sin(angles[i])).toFixed(1)}`).join(" ");
  let dots = "", texts = "";
  vals.forEach((v, i) => {
    const px = cx + r * Math.max(0.03, v / maxV) * Math.cos(angles[i]);
    const py = cy + r * Math.max(0.03, v / maxV) * Math.sin(angles[i]);
    dots += `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="4" fill="${colors[i]}"/>`;
    const lx = cx + (r + 24) * Math.cos(angles[i]);
    const ly = cy + (r + 24) * Math.sin(angles[i]);
    const anchor = Math.abs(Math.cos(angles[i])) < 0.3 ? "middle" : (Math.cos(angles[i]) > 0 ? "start" : "end");
    texts += `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="${anchor}" dominant-baseline="middle" font-size="12" fill="${colors[i]}">${labels[i]} ${Math.round(v * 10) / 10}</text>`;
  });
  return `<svg viewBox="0 0 220 220" style="width:100%;max-width:280px;display:block;margin:6px auto">${rings}${axes}<polygon points="${dataPts}" fill="rgba(255,211,61,.16)" stroke="#ffd33d" stroke-width="2"/>${dots}${texts}</svg>`;
}

function achievementStatus() {
  const settledDates = Object.keys(state.history).filter(d => state.history[d].settled);
  const settledCount = settledDates.length;
  const streak = computeStreak();
  const tot = totals();
  const info = levelsOf(tot);
  let studyHours = 0, writeWords = 0, bestDay = 0;
  let gymCount = 0, waterOk = 0, wakeupCount = 0;
  for (const e of Object.values(state.history)) {
    if (!e.settled) continue;
    if (e.items) {
      studyHours += Number(e.items.know_study) || 0;
      writeWords += Number(e.items.skill_writing) || 0;
      if (e.items.body_gym) gymCount++;
      if (Number(e.items.body_water) >= 2000) waterOk++;
      if (e.items.charm_wakeup) wakeupCount++;
    }
    const t = dayTotal(e); if (t !== null) bestDay = Math.max(bestDay, t);
  }
  const minLevel = Math.min(info.body.level, info.knowledge.level, info.skill.level, info.charm.level);
  const tests = {
    first_settle: settledCount >= 1, settled10: settledCount >= 10, settled50: settledCount >= 50,
    streak3: streak >= 3, streak7: streak >= 7, streak30: streak >= 30,
    study50: studyHours >= 50, study100: studyHours >= 100, study500: studyHours >= 500,
    write50k: writeWords >= 50000, write100k: writeWords >= 100000, write500k: writeWords >= 500000,
    body5: tot.body >= 5, knowledge5: tot.knowledge >= 5, skill5: tot.skill >= 5, charm5: tot.charm >= 5,
    char3: info.characterLevel >= 3, char5: info.characterLevel >= 5, char8: info.characterLevel >= 8,
    perfect_day: bestDay >= 5, balanced: minLevel >= 1, balanced2: minLevel >= 2
  };
  return { tests, stats: { settledCount, streak, studyHours: Math.round(studyHours), writeWords: Math.round(writeWords), bestDay, characterLevel: info.characterLevel } };
}

function toggleAchievements() {
  const p = document.getElementById("achPanel");
  const b = document.getElementById("achBtn");
  if (p.hidden) { renderAchievements(); p.hidden = false; b.textContent = "🏆 收起成就"; }
  else { p.hidden = true; b.textContent = "🏆 成就"; }
}
function renderAchievements() {
  const { tests, stats } = achievementStatus();
  const unlocked = Object.values(tests).filter(Boolean).length;
  let html = `<h3>🏆 成就系统（${unlocked}/${ACHIEVEMENTS.length} 已解锁）</h3>`;
  html += `<div class="ach-stats">已结算 <b>${stats.settledCount}</b> 天 · 连续 <b>${stats.streak}</b> 天 · 累计学习 <b>${stats.studyHours}</b> 小时 · 累计写作 <b>${stats.writeWords}</b> 字 · 最佳单日 <b>${stats.bestDay}</b> 分 · 境界 <b>${realmLabel(stats.characterLevel)}</b></div><div class="ach-grid">`;
  for (const a of ACHIEVEMENTS) html += `<div class="ach-card ${tests[a.id] ? "unlocked" : "locked"}"><div class="ach-icon">${tests[a.id] ? a.icon : "🔒"}</div><div class="ach-name">${a.name}</div><div class="ach-desc">${a.desc}</div></div>`;
  html += `</div>`;
  document.getElementById("achPanel").innerHTML = html;
}

/* ================= 数据备份 ================= */
function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = `知行合一备份_${todayStr()}.json`;
  document.body.appendChild(a); a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(a.href); }, 100);
}
function importData() { document.getElementById("importFile").click(); }
document.getElementById("importFile").addEventListener("change", (e) => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!data || typeof data.history !== "object") throw new Error("bad");
      if (confirm("导入将覆盖当前所有数据，确定继续吗？")) { state = data; save(); render(); alert("✅ 导入成功！"); }
    } catch { alert("❌ 导入失败。"); }
  };
  reader.readAsText(f);
});

/* ================= 每日结算评价 ================= */
function dailyReview(scores, items) {
  const parts = [];
  const total = Math.round((scores.body + scores.knowledge + scores.skill + scores.charm) * 1000) / 1000;
  const studyH = Number(items.know_study) || 0;
  if (studyH >= 8) parts.push(`学习 ${studyH} 小时，你已不是人，是台行走的学习永动机`);
  else if (studyH >= 5) parts.push(`学习 ${studyH} 小时，卷王本王，楚子航看了都沉默`);
  else if (studyH >= 2) parts.push(`学习 ${studyH} 小时，及格线以上，但离传说还差口气`);
  else if (studyH > 0) parts.push(`才学习 ${studyH} 小时？就这？你的对手正在疯狂刷题`);
  else parts.push(`今天一点没学，你是不是把系统当许愿池了`);
  const words = Number(items.skill_writing) || 0;
  if (words >= 16000) parts.push(`写作 ${words} 字，键盘都要冒火星了，稿费收割机`);
  else if (words >= 12000) parts.push(`写作 ${words} 字，码字小钢炮，超额完成任务`);
  else if (words >= 8000) parts.push(`写作 ${words} 字，笔耕不辍，像个修仙者`);
  else if (words > 0) parts.push(`写作 ${words} 字，系统鼓励你多写多赚分`);
  else parts.push(`一个字没写，你的笔在哭泣`);
  const posts = Number(items.skill_post) || 0;
  if (posts >= 2) parts.push(`支付宝帖子 ${posts} 篇，笔耕不辍，铁饭碗在路上`);
  else if (posts > 0) parts.push(`帖子才 ${posts} 篇？不足 2 篇整项归零，血亏`);
  else parts.push(`帖子一篇没发，硬性底线直接躺平`);
  if (items.body_gym) parts.push(`今日活动达标，身体在变强`);
  else parts.push(`没怎么动，肉体在偷懒，灵魂也在偷懒`);
  if (items.body_eyes) parts.push(`护眼了，眼睛感谢你，明天继续刷题不瞎`);
  if (items.body_shower) parts.push(`洗浴了，身心清爽，一天的精神都回来了`);
  if (items.body_nosnack) parts.push(`戒零食成功，意志力 +100`);
  else parts.push(`零食破戒？你的腹肌在闹离婚`);
  const water = Number(items.body_water) || 0;
  if (water >= 2000) parts.push(`喝水 ${water}ml，水润满分，皮肤在发光`);
  else if (water > 0) parts.push(`才喝 ${water}ml？离 2000ml 还远，你是仙人掌吗`);
  else parts.push(`一滴水没喝，你的身体在喊救命`);
  if (items.charm_posture) parts.push(`挺胸抬头，气场两米八`);
  if (items.charm_skincare && items.charm_skincare.m && items.charm_skincare.n) parts.push(`早晚护肤齐全，皮肤在发光`);
  if (items.charm_speech) parts.push(`忍住了一次吐槽，境界 +1，你正在变成情绪的主人`);
  if (items.charm_wakeup) parts.push(`准时起床，战胜了被窝这个魔王`);
  if (items.charm_praise) parts.push(`今天赞美了别人，情商在线，社交分拉满`);
  if (items.charm_dress) parts.push(`今天穿搭得体，气质这块拿捏住了`);
  if (items.charm_selfctrl) parts.push(`克己成功，今天的你战胜了欲望——强者恒强`);
  else if (items.charm_selfctrl === false) parts.push(`克己失败，又被欲望打败了...明天重新来过`);
  if (items.charm_anger) parts.push(`制怒成功，今天的你没有发脾气——心性又进一步`);
  else if (items.charm_anger === false) parts.push(`制怒失败，今天没控制住脾气。下次一定忍住`);

  let verdict;
  if (total >= 5) verdict = `今日评级 S — 完美人生系统运转良好，你就是行走的传说`;
  else if (total >= 4) verdict = `今日评级 A — 相当像样，离完美人生只差一点点骚操作`;
  else if (total >= 2.5) verdict = `今日评级 B — 中规中矩，系统不失望也不惊喜`;
  else if (total >= 1) verdict = `今日评级 C — 及格边缘试探，摸了但没完全摸`;
  else if (total >= 0) verdict = `今日评级 D — 半摸鱼状态，系统决定再给你一次机会`;
  else verdict = `今日评级 F — 零分战士！连系统都替你脸红，明天重新做人`;

  const isMiss = (p) => /没|才学|才喝|才写|差|破戒|躺平|不足|没去|一滴|失败/.test(p);
  const highlights = parts.filter(p => !isMiss(p));
  const misses = parts.filter(p => isMiss(p));
  const keep = [...highlights.slice(0, 2), ...misses.slice(0, 1)].join("\n") || parts[0];
  return { glow: "📋 今日结算", title: `得分 ${total}`, rank: verdict.split("—")[0].trim(), desc: keep + "\n\n" + verdict, btn: "收下评价 💪" };
}

/* ================= 历史记录 ================= */
function itemMeta(id) {
  for (const attr of Object.values(CONFIG.attributes)) {
    const it = attr.items.find(x => x.id === id);
    if (it) return { name: it.name, type: it.type, attr: attr.label };
  }
  return null;
}
function itemLabel(id, v) {
  const m = itemMeta(id);
  if (!m) return id;
  if (m.type === "boolean" || m.type === "discipline") return `${m.name}：${v ? "✓" : "—"}`;
  if (m.type === "skincare") return `${m.name}：早${v && v.m ? "✓" : "—"} 晚${v && v.n ? "✓" : "—"}`;
  if (m.type === "study") return `${m.name}：${v || 0} 小时`;
  if (id === "skill_writing") return `${m.name}：${v || 0} 字`;
  if (id === "skill_post") return `${m.name}：${v || 0} 篇`;
  if (id === "body_water") return `${m.name}：${v || 0} ml`;
  return `${m.name}：${v}`;
}

  const p = document.getElementById("historyPanel");
  const b = document.getElementById("histBtn");
  if (p.hidden) { renderHistory(); p.hidden = false; b.textContent = "📅 收起历史"; } else { p.hidden = true; b.textContent = "📅 历史"; }
}

  const tot = totals(); const info = levelsOf(tot);
  const dates = Object.keys(state.history).sort().reverse();
  let html = `<h3>📜 修炼日志（${dates.length} 天）· 累计：体魄 ${fmt(tot.body)} · 学识 ${fmt(tot.knowledge)} · 技能 ${fmt(tot.skill)} · 魅力 ${fmt(tot.charm)} · 境界 ${realmLabel(info.characterLevel)}「${rankFor(info.characterLevel).title}」</h3>`;
  if (!dates.length) html += `<div class="hint">还没有修炼记录。</div>`;
  for (const d of dates) {
    const e = state.history[d]; const s = e.scores;
    const line = s ? `体<b>${fmt(s.body)}</b> · 学<b>${fmt(s.knowledge)}</b> · 技<b>${fmt(s.skill)}</b> · 魅<b>${fmt(s.charm)}</b>` : `<span style="color:var(--dim)">未结算</span>`;
    const reviewTxt = e.review && e.review.title ? ` · ${e.review.rank}` : "";
    const detailItems = e.items ? Object.entries(e.items).filter(([id, v]) => { const m = itemMeta(id); if (!m) return false; if (m.type === "boolean" || m.type === "discipline") return true; if (m.type === "skincare") return !!(v && (v.m || v.n)); return Number(v) > 0; }).map(([id, v]) => `<span class="hist-tag done">${itemLabel(id, v)}</span>`).join("") : "";
    html += `<div class="hist-row" onclick="toggleHistDetail('${d}')" style="cursor:pointer"><span class="hist-date">${d}</span><span class="hist-scores">${line}</span><span class="hist-flag ${e.settled ? "on" : "off"}">${e.settled ? "✓ 已结算" : "未结算"}${reviewTxt}</span></div><div class="hist-detail" id="histd_${d}" hidden>${detailItems || '<span style="color:var(--dim)">（无打卡明细）</span>'}</div>`;
  }
  panel.innerHTML = html;
}
function toggleHistDetail(d) { const el = document.getElementById(`histd_${d}`); if (el) el.hidden = !el.hidden; }

function resetAll() {
  if (confirm("确定清空全部数据？（所有数据将永久删除）")) {
    localStorage.removeItem(KEY);
    state = { history: {}, dataVersion: DATA_VERSION, spiritStones: 110000, streakRewards: [], bonusPoints: { body: 0, knowledge: 0, skill: 0, charm: 0 } };
    document.getElementById("weekPanel").hidden = true; document.getElementById("achPanel").hidden = true; document.getElementById("historyPanel").hidden = true;
    document.getElementById("weekBtn").textContent = "📊 统计雷达"; document.getElementById("achBtn").textContent = "🏆 成就"; document.getElementById("histBtn").textContent = "📅 历史";
    render();
  }
}

/* ================= 启动 ================= */
render();
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js');
}
</script>
